<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOR Errors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23161a22'/><text x='12' y='23' font-family='monospace' font-size='16' fill='%23ff7a6b'>!</text></svg>">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2027; --muted: #6b6f78; --line: #e4e2dc;
    --accent: #c2412d; --accent-soft: #f8e4df; --ok: #2f7d4f; --ok-soft: #e3f1e7;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --panel: #1a1d25; --ink: #e6e7ea; --muted: #8d929c; --line: #2a2e38;
      --accent: #ff7a6b; --accent-soft: #3a1f1b; --ok: #86e1a0; --ok-soft: #1d3326;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font: 600 20px var(--mono); margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font: 13px var(--mono); }
  header .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; }
  a { color: var(--muted); }
  .chip { font: 12px var(--mono); padding: 2px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--accent-soft); color: var(--accent); }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 11px; font: 13px var(--mono); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--ink); color: var(--bg); }
  input[type=search] {
    flex: 1; min-width: 180px; padding: 7px 11px; font: 14px var(--mono); color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px; outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px;
         padding: 6px 12px; font: 13px var(--sans); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .summary { color: var(--muted); font-size: 13px; margin: 4px 0 14px; min-height: 20px; }
  .summary b { color: var(--ink); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 12px 14px; cursor: pointer; align-items: start; }
  .count { font: 600 13px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 7px;
           padding: 2px 8px; min-width: 38px; text-align: center; }
  .time { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .note { font: 13px/1.45 var(--mono); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3;
          -webkit-box-orient: vertical; overflow: hidden; }
  .open > .head .note { -webkit-line-clamp: unset; }
  .where { font: 12px var(--mono); color: var(--muted); margin-top: 3px; }
  .body { display: none; border-top: 1px solid var(--line); padding: 10px 14px 14px; }
  .open > .body { display: block; }
  .occ { border-left: 2px solid var(--line); padding: 6px 0 6px 12px; margin: 6px 0; }
  .occ .head { padding: 0; grid-template-columns: 1fr auto; }
  .label { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  pre { margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
        background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .frames div { font: 12px/1.6 var(--mono); }
  .frames .v { color: var(--muted); opacity: .7; }
  .frames .fn { color: var(--muted); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; text-align: center; }
  .panel h2 { font: 600 16px var(--sans); margin: 0 0 6px; }
  .panel p { color: var(--muted); margin: 6px 0 14px; }
  .code { font: 600 26px var(--mono); letter-spacing: .12em; margin: 10px 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .empty b { display: block; color: var(--ok); font-size: 17px; margin-bottom: 4px; }
  .err { color: var(--accent); }
  @media (max-width: 600px) {
    .head { grid-template-columns: auto 1fr; }
    .head .time { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>!</span> blor errors</h1>
    <span class="sub" id="group">prod · CloudWatch</span>
    <div class="right">
      <span class="chip" id="aws">…</span>
      <a href="/logout">Log out</a>
    </div>
  </header>

  <div class="bar">
    <div class="seg" id="ranges"></div>
    <div class="seg" id="views">
      <button data-v="grouped">Grouped</button><button data-v="all">All</button>
    </div>
    <input type="search" id="q" placeholder="Filter text, file, code…">
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</div>

<script>
const RANGES = [["1h","1 hour"],["24h","24 hours"],["7d","7 days"],["30d","30 days"],["90d","90 days"]];
const st = { range: localGet("range") || "7d", view: localGet("view") || "grouped", data: null, open: new Set() };
const $ = id => document.getElementById(id);

function localGet(k) { try { return localStorage.getItem("be." + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem("be." + k, v); } catch {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmt(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "today " + time;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + " " + time;
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
const where = it => it.frames.length ? `${it.frames[0].file}:${it.frames[0].line}` : "";
// The part of a message before its variable details (payload, query, user data).
const headline = note => note.split(/ \| | - user:| Query:|\{/)[0].trim() || note.slice(0, 160);
const groupKey = it => headline(it.note).replace(/\b[0-9a-f]{8,}\b/gi, "#").replace(/\d+/g, "#").slice(0, 120) + "@" + where(it);

function renderControls() {
  $("ranges").innerHTML = RANGES.map(([k]) => `<button data-r="${k}" class="${k === st.range ? "on" : ""}">${k}</button>`).join("");
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === st.view));
}

function details(it) {
  const extra = Object.keys(it.extra || {}).length ? `<div class="label">Data</div><pre>${esc(JSON.stringify(it.extra, null, 2))}</pre>` : "";
  const frames = it.frames.map(f => `<div class="${f.vendor ? "v" : ""}">${esc(f.file)}:${esc(f.line)} <span class="fn">${esc(f.fn)}</span></div>`).join("");
  return `<div class="label">Message</div><pre>${esc(it.note)}</pre>
    ${it.code ? `<div class="label">Code</div><pre>${esc(it.code)}</pre>` : ""}
    ${extra}
    ${frames ? `<div class="label">Stack trace</div><div class="frames">${frames}</div>` : ""}`;
}

function render() {
  const d = st.data;
  if (!d) return;
  const q = $("q").value.trim().toLowerCase();
  const items = d.items.filter(it => !q || (it.note + " " + (it.code || "") + " " + it.frames.map(f => f.file + " " + f.fn).join(" ")).toLowerCase().includes(q));
  const label = RANGES.find(r => r[0] === d.range)[1];
  const more = d.matched > d.items.length ? ` · showing the newest ${d.items.length}` : "";
  $("summary").innerHTML = `<b>${d.matched}</b> error${d.matched === 1 ? "" : "s"} in the last ${label}${more}` +
    (q ? ` · <b>${items.length}</b> match the filter` : "") + ` · updated ${new Date(d.fetched * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}`;

  if (!items.length) {
    $("list").innerHTML = d.items.length
      ? `<div class="empty">Nothing matches the filter.</div>`
      : `<div class="empty"><b>No errors</b>in the last ${label}.</div>`;
    return;
  }
  if (st.view === "all") {
    $("list").innerHTML = items.map((it, i) => {
      const id = "a" + it.ts + i;
      return `<div class="card ${st.open.has(id) ? "open" : ""}" data-id="${id}">
        <div class="head"><span class="count">1</span>
          <div><div class="note">${esc(it.note)}</div><div class="where">${esc(where(it))}</div></div>
          <span class="time" title="${esc(new Date(it.ts).toString())}">${fmt(it.ts)}</span></div>
        <div class="body">${st.open.has(id) ? details(it) : ""}</div></div>`;
    }).join("");
    return;
  }
  const groups = new Map();
  for (const it of items) {
    const k = groupKey(it);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  $("list").innerHTML = [...groups.entries()].map(([k, list]) => {
    const id = "g" + k, last = list[0], first = list[list.length - 1];
    const span = list.length > 1 ? `${fmt(first.ts)} → ${fmt(last.ts)}` : fmt(last.ts);
    const body = !st.open.has(id) ? "" : list.slice(0, 50).map((it, i) => {
      const oid = id + "|" + it.ts + i;
      return `<div class="occ card ${st.open.has(oid) ? "open" : ""}" data-id="${esc(oid)}" style="border:0;margin:0;border-radius:0;border-left:2px solid var(--line)">
        <div class="head"><div class="note">${esc(it.note)}</div><span class="time">${fmt(it.ts)}</span></div>
        <div class="body" style="border:0;padding:6px 0 0">${st.open.has(oid) ? details(it) : ""}</div></div>`;
    }).join("") + (list.length > 50 ? `<p class="sub">…and ${list.length - 50} more (use “All”)</p>` : "");
    return `<div class="card ${st.open.has(id) ? "open" : ""}" data-id="${esc(id)}">
      <div class="head"><span class="count">${list.length}×</span>
        <div><div class="note">${esc(headline(last.note))}</div><div class="where">${esc(where(last))}</div></div>
        <span class="time" title="${esc(span)}">${ago(last.ts)}</span></div>
      <div class="body">${body}</div></div>`;
  }).join("");
}

function connectPanel(msg) {
  $("summary").textContent = "";
  $("list").innerHTML = `<div class="panel"><h2>Connect to AWS</h2>
    <p>${msg || "The page needs your AWS login (BlorTeam role) to read the logs. You do this once; it then renews by itself until AWS ends the session."}</p>
    <div id="login"><button class="btn primary" id="connect">Connect AWS</button></div></div>`;
  $("connect").onclick = startLogin;
}

async function startLogin() {
  $("login").innerHTML = "Starting…";
  const r = await fetch("/api/aws/login", { method: "POST" });
  const j = await r.json();
  if (!r.ok) { $("login").innerHTML = `<span class="err">${esc(j.error)}</span>`; return; }
  $("login").innerHTML = `<p>Open the AWS page, log in, and confirm this code:</p>
    <div class="code">${esc(j.code)}</div>
    <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open AWS login</a>
    <p class="sub" id="pstate">Waiting for approval…</p>`;
  const until = Date.now() + j.expiresIn * 1000;
  while (Date.now() < until) {
    await new Promise(res => setTimeout(res, 3000));
    const p = await (await fetch("/api/aws/poll")).json();
    if (p.state === "ok") { loadStatus(); return load(true); }
    if (p.state !== "pending") { connectPanel(p.state === "denied" ? "The login was refused. Try again." : "The code expired. Try again."); return; }
  }
  connectPanel("The code expired. Try again.");
}

async function loadStatus() {
  const r = await fetch("/api/status");
  if (r.status === 401) return location.reload();
  const s = await r.json();
  $("group").textContent = `prod · ${s.logGroup}`;
  const chip = $("aws");
  if (s.mode === "credentials") { chip.textContent = "AWS key"; chip.className = "chip"; chip.title = ""; }
  else if (s.connected) {
    chip.textContent = `AWS · ${s.role}`; chip.className = "chip";
    chip.title = s.since ? "Logged in " + new Date(s.since * 1000).toLocaleString() + " — click to disconnect" : "";
    chip.style.cursor = "pointer";
    chip.onclick = async () => { if (confirm("Disconnect the AWS login?")) { await fetch("/api/aws/logout", { method: "POST" }); loadStatus(); connectPanel(); } };
  } else { chip.textContent = "AWS not connected"; chip.className = "chip bad"; chip.onclick = null; }
}

let loading = 0;
async function load(force) {
  const mine = ++loading;
  $("summary").textContent = "Loading…";
  if (!st.data || st.data.range !== st.range) $("list").innerHTML = "";
  try {
    const r = await fetch(`/api/errors?range=${st.range}${force ? "&refresh=1" : ""}`);
    if (mine !== loading) return;
    if (r.status === 401) return location.reload();
    const j = await r.json();
    if (j.needLogin) { loadStatus(); return connectPanel(); }
    if (!r.ok) { $("summary").innerHTML = `<span class="err">${esc(j.error)}</span>`; return; }
    st.data = j; render();
  } catch (e) {
    if (mine === loading) $("summary").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$("ranges").onclick = e => { const r = e.target.dataset.r; if (!r) return; st.range = r; localSet("range", r); st.open.clear(); renderControls(); load(); };
$("views").onclick = e => { const v = e.target.dataset.v; if (!v) return; st.view = v; localSet("view", v); renderControls(); render(); };
$("q").oninput = render;
$("refresh").onclick = () => load(true);
$("list").onclick = e => {
  if (e.target.closest("a, .body pre, .frames")) return;
  const head = e.target.closest(".head"); if (!head) return;
  const card = head.parentElement, id = card.dataset.id;
  st.open.has(id) ? st.open.delete(id) : st.open.add(id);
  render();
};
setInterval(() => { if (!document.hidden && st.data) load(); }, 5 * 60 * 1000);

renderControls();
loadStatus();
load();
</script>
</body>
</html>
