# Deployed on the Mac mini in ~/blor-errors (see deploy.sh).
# BLOR_ERRORS_PASSWORD (and optional AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)
# are set in Portainer on the container, never here: deploy.sh copies the
# running container's values into the shell, and the bare names below pass
# them through, so a redeploy keeps what Portainer set.
services:
  blor-errors:
    build: .
    container_name: blor-errors
    restart: unless-stopped
    environment:
      - BLOR_ERRORS_PASSWORD
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION=eu-central-1
      - LOG_GROUP=blor-website-log-group
      - SSO_ROLE_NAME=BlorTeam
    ports:
      - "100.115.194.118:8094:8094"   # Tailscale only
    volumes:
      - ./data:/data                  # SSO token + cookie secret (mode 600)
