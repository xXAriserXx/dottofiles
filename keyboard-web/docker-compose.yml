# Deployed on the Mac mini in ~/keyboard-web. Static page generated by build.py
# from aerospace.toml + karabiner-apple.json; deploy.sh rebuilds and syncs it.
services:
  keyboard-web:
    image: nginx:alpine
    container_name: keyboard-web
    restart: unless-stopped
    ports:
      - "100.115.194.118:8093:80"   # Tailscale only
    volumes:
      - ./site:/usr/share/nginx/html:ro
