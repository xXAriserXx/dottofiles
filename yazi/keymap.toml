# Movement shifted one key right: j = left, k = down, l = up, ; = right.
# The keys it displaces move to the freed h/H.

[mgr]
prepend_keymap = [
	{ on = "j", run = "leave",      desc = "Back to the parent directory" },
	{ on = "k", run = "arrow next", desc = "Next file" },
	{ on = "l", run = "arrow prev", desc = "Previous file" },
	{ on = ";", run = "enter",      desc = "Enter the child directory" },
	{ on = "J", run = "back",       desc = "Back to previous directory" },
	{ on = "K", run = "seek 5",     desc = "Seek down 5 units in the preview" },
	{ on = "L", run = "seek -5",    desc = "Seek up 5 units in the preview" },
	{ on = ":", run = "forward",    desc = "Forward to next directory" },
	{ on = "h", run = "shell --interactive",         desc = "Run a shell command" },
	{ on = "H", run = "shell --block --interactive", desc = "Run a shell command (block until finishes)" },
]

[spot]
prepend_keymap = [
	{ on = "k", run = "arrow next", desc = "Next line" },
	{ on = "l", run = "arrow prev", desc = "Previous line" },
	{ on = "j", run = "swipe prev", desc = "Swipe to previous file" },
	{ on = ";", run = "swipe next", desc = "Swipe to next file" },
]

[tasks]
prepend_keymap = [
	{ on = "k", run = "arrow next", desc = "Next task" },
	{ on = "l", run = "arrow prev", desc = "Previous task" },
]

[pick]
prepend_keymap = [
	{ on = "k", run = "arrow next", desc = "Next option" },
	{ on = "l", run = "arrow prev", desc = "Previous option" },
]

[confirm]
prepend_keymap = [
	{ on = "k", run = "arrow next", desc = "Next line" },
	{ on = "l", run = "arrow prev", desc = "Previous line" },
]

[help]
prepend_keymap = [
	{ on = "k", run = "arrow next", desc = "Next line" },
	{ on = "l", run = "arrow prev", desc = "Previous line" },
]
