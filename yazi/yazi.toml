# Enter opens each file with the same viewer as the `op` function in zshrc.
# Images open full-window inside the terminal in mpv (no Preview.app window for AeroSpace to tile):
# r/f zoom, jkl; pan, 0 resets, q returns to yazi. Keys in mpv-image.conf.

[opener]
image = [
	{ run = 'if [ "$TERM_PROGRAM" = WezTerm ] || [ "$TERM" = xterm-kitty ]; then vo=kitty; else vo=tct; fi; mpv --vo=$vo --really-quiet --image-display-duration=inf --input-conf="$HOME/.config/yazi/mpv-image.conf" -- %s1', block = true, desc = "mpv (zoom r/f, pan jkl;)" },
]
pdf = [
	{ run = "tdf -- %s1", block = true, desc = "tdf" },
]
video = [
	{ run = 'if [ "$TERM_PROGRAM" = WezTerm ] || [ "$TERM" = xterm-kitty ]; then mpv --vo=kitty --really-quiet -- %s; else mpv --vo=tct --really-quiet -- %s; fi', block = true, desc = "mpv" },
]
audio = [
	{ run = "mpv --no-video -- %s", block = true, desc = "mpv (audio)" },
]
sheet = [
	{ run = "vd -- %s", block = true, desc = "VisiData" },
]

[open]
prepend_rules = [
	{ url = "*.{png,jpg,jpeg,webp,gif,svg,PNG,JPG,JPEG,WEBP,GIF,SVG}", use = [ "image", "open", "reveal" ] },
	{ url = "*.{pdf,PDF}", use = [ "pdf", "open", "reveal" ] },
	{ url = "*.{mp4,mkv,MP4,MKV}", use = [ "video", "open", "reveal" ] },
	{ url = "*.{mp3,m4a,MP3,M4A}", use = [ "audio", "open", "reveal" ] },
	{ url = "*.{csv,xls,xlsx,CSV,XLS,XLSX}", use = [ "sheet", "open", "reveal" ] },
]

# Sharper preview pane for large images (defaults: 600x900).
[preview]
max_width  = 2400
max_height = 2400
