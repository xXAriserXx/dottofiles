# mpv keys for viewing images from yazi (passed with --input-conf; videos keep mpv's defaults).
# Movement matches yazi: j = left, k = down, l = up, ; = right.
r add video-zoom  0.25
f add video-zoom -0.25
j add video-pan-x  0.05
; add video-pan-x -0.05
k add video-pan-y -0.05
l add video-pan-y  0.05
0 set video-zoom 0; set video-pan-x 0; set video-pan-y 0
